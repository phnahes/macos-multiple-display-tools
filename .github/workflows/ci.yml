name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck \
            bin/monitor \
            setup.sh \
            install.sh \
            uninstall.sh \
            app/build.sh \
            tests/run.sh \
            tests/fake-m1ddc \
            tests/fake-ioreg

  test:
    name: Tests and build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: CLI test suite
        run: ./tests/run.sh

      - name: Build app
        run: ./app/build.sh

      - name: Check helper binary
        run: test -x app/build/lidangle
