name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: ./app/build.sh

      - name: Package
        run: |
          set -euo pipefail
          cd app/build
          zip="MonitorBar-${GITHUB_REF_NAME}-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent MonitorBar.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          ls -lh "$zip" "$zip.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="app/build/MonitorBar-${GITHUB_REF_NAME}-macos.zip"
          gh release create "$GITHUB_REF_NAME" \
            "$zip" \
            "$zip.sha256" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
